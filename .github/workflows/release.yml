name: Flutter GitHub Release

on:
  push:
    tags:
      - 'v*' # Triggers workflow only when a tag starting with 'v' is pushed (e.g., v1.0.0)

jobs:
  build-and-release:
    # Use macos-latest if you need to build iOS (requires an Apple Developer Account for full code-signing)
    # Use ubuntu-latest if you only want to build Android APK/App Bundle
    runs-on: macos-latest 

    permissions:
      contents: write # Crucial permission allowing the runner to create the release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17' # Required for modern Flutter Gradle builds

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true # Caches Flutter packages to make future builds faster

      - name: Install dependencies
        run: flutter pub get

      - name: Install Android CMake
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.22.1"

      - name: Build Android APKs
        run: |
            flutter pub run build_runner build --delete-conflicting-outputs
            # Build Universal (Fat) APK
            flutter build apk --release
            mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-universal-release.apk
            # Build Split APKs (smaller file sizes)
            flutter build apk --release --split-per-abi

      - name: Build Android App Bundle (Optional)
        run: flutter build appbundle --release

      - name: Build iOS IPA
        run: |
          # Note: This builds an unsigned IPA. 
          # To install on devices, you must inject provisioning profiles prior to this step.
          flutter build ipa --release --no-codesign

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          body: |
            Automated Release for version ${{ github.ref_name }}
            
            **Changes in this build:**
            - Automatically compiled binaries attached below.
          draft: false
          prerelease: false
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/app-release.aab
            build/ios/ipa/*.ipa
